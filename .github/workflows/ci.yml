name: ci

# Fast feedback on every change: typecheck, build, and the unit tests.
# No database is provisioned here, so the DB-backed tests self-skip
# (they early-return when DATABASE_URL is unset). The full data-backed
# suite runs in the scheduled `sync` workflow.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vendored Fusorb snapshot in sync
        run: pnpm check:fusorb

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r build

      - name: Unit tests (no database)
        run: pnpm test:run
